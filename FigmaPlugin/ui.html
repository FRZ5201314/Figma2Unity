<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, Arial, sans-serif;
      font-size: 12px;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      color: var(--figma-color-text-secondary);
    }

    select,
    input {
      box-sizing: border-box;
      width: 100%;
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--figma-color-border);
      border-radius: 4px;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
    }

    button {
      width: 100%;
      height: 34px;
      margin-top: 14px;
      border: 0;
      border-radius: 4px;
      background: var(--figma-color-bg-brand);
      color: var(--figma-color-text-onbrand);
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .panel {
      padding: 10px;
      border: 1px solid var(--figma-color-border);
      border-radius: 6px;
      background: var(--figma-color-bg-secondary);
    }

    .muted {
      color: var(--figma-color-text-secondary);
    }

    .status {
      min-height: 34px;
      margin-top: 12px;
      line-height: 17px;
      word-break: break-word;
    }

    progress {
      width: 100%;
      height: 8px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Figma2Unity Offline Exporter</h1>

  <div class="panel">
    <div id="selection" class="muted">正在读取当前选择...</div>
  </div>

  <label for="mode">导出模式</label>
  <select id="mode">
    <option value="markedThenAuto">ExportSettings 优先，并补齐可见图层</option>
    <option value="markedOnly">只导出已设置 Export 的节点</option>
    <option value="autoOnly">自动导出可见图层</option>
    <option value="referenceOnly">仅导出整张参考图</option>
  </select>

  <label for="containerStrategy">容器处理策略</label>
  <select id="containerStrategy">
    <option value="auto">自动：保留容器底图并展开组件实例</option>
    <option value="strict">严格 ExportSettings：标记容器优先</option>
    <option value="expand">强制展开容器：尽量拆到子级</option>
  </select>

  <label for="scale">图片倍率</label>
  <input id="scale" type="number" min="0.01" max="4" step="0.25" value="1">

  <button id="export" disabled>导出 .figma2unity.json</button>

  <div id="status" class="status muted"></div>
  <progress id="progress" min="0" max="1" value="0" hidden></progress>

  <script>
    const exportButton = document.getElementById("export");
    const selectionBox = document.getElementById("selection");
    const statusBox = document.getElementById("status");
    const progress = document.getElementById("progress");
    const modeInput = document.getElementById("mode");
    const containerStrategyInput = document.getElementById("containerStrategy");
    const scaleInput = document.getElementById("scale");
    let selectionOk = false;

    exportButton.addEventListener("click", () => {
      setBusy(true);
      statusBox.textContent = "开始导出...";
      progress.hidden = false;
      progress.value = 0;
      parent.postMessage({
        pluginMessage: {
          type: "export-package",
          mode: modeInput.value,
          containerStrategy: containerStrategyInput.value,
          scale: Number(scaleInput.value)
        }
      }, "*");
    });

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message) {
        return;
      }

      if (message.type === "selection") {
        selectionOk = !!message.ok;
        exportButton.disabled = !selectionOk;
        selectionBox.textContent = message.ok
          ? `${message.name}  [${message.nodeType}]  ${message.id}`
          : message.message;
      }

      if (message.type === "progress") {
        statusBox.textContent = message.message;
        progress.hidden = false;
        progress.value = message.value || 0;
      }

      if (message.type === "done") {
        progress.value = 1;
        statusBox.textContent = "导出完成，正在下载...";
        downloadPackage(message.package);
        setBusy(false);
        statusBox.textContent = "已下载离线包，可在 Unity 中点击“从 Figma 插件包导入”。";
      }

      if (message.type === "error") {
        setBusy(false);
        progress.hidden = true;
        statusBox.textContent = message.message || "导出失败。";
      }
    };

    function setBusy(isBusy) {
      exportButton.disabled = isBusy || !selectionOk;
      modeInput.disabled = isBusy;
      containerStrategyInput.disabled = isBusy;
      scaleInput.disabled = isBusy;
    }

    function downloadPackage(packageData) {
      const json = JSON.stringify(packageData);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      const manifest = packageData.manifest || {};
      anchor.href = url;
      anchor.download = `${safeFileName(manifest.selectedNodeName || "figma")}_${safeFileName(manifest.selectedNodeId || "selection")}.figma2unity.json`;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function safeFileName(value) {
      return String(value).replace(/[\\/:*?"<>|]/g, "_");
    }
  </script>
</body>
</html>
